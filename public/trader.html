<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amani Africa — Trader Assistant</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="phone">
    <div class="phone-header">
      <a href="index.html" class="back">←</a>
      <div>
        <div class="phone-title">Amani Africa</div>
        <div class="phone-subtitle">Trader Assistant</div>
      </div>
    </div>

    <div class="market-select">
      <label for="marketPicker">Your market:</label>
      <select id="marketPicker"></select>
    </div>

    <div class="chat" id="chat"></div>

    <div class="quick-replies" id="quickReplies">
      <button data-msg="is-safe">Is it safe to trade today?</button>
      <button data-msg="vouch">Vouch me for my market</button>
      <button data-msg="factcheck">Latest fact-check</button>
      <button data-msg="status">Check my vouch status</button>
    </div>

    <form class="chat-input" id="chatForm">
      <input type="text" id="chatText" placeholder="Or type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script src="js/trader.js"></script>
</body>
</html>
